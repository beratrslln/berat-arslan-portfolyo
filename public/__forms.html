<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <title>Form uç noktası</title>
    <meta name="robots" content="noindex" />
  </head>
  <body>
    <!-- Netlify form keşfi için statik iskelet: React formu buradaki alan adlarıyla birebir eşleşmeli -->
    <form name="proje-talebi" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="proje-talebi" />
      <input type="hidden" name="subject" value="Yeni proje talebi — %{formName}" data-remove-prefix />
      <p hidden><label>Doldurmayın: <input name="bot-field" /></label></p>
      <input type="text" name="ad" />
      <input type="email" name="eposta" />
      <textarea name="mesaj"></textarea>
      <input type="text" name="tur" />
      <input type="text" name="zaman" />
    </form>
    <p>Bu sayfa yalnızca form gönderimi içindir. <a href="/">Portfolyoya dön</a>.</p>
  </body>
</html>
