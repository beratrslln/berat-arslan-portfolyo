[build]
  command = "npm run build"
  publish = "dist"

# Tek sayfalik uygulama: butun yollar index.html'e duser
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Hash'li build ciktilari: uzun omurlu onbellek
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Gorseller: bir ay onbellek
[[headers]]
  for = "/gorseller/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/og.jpg"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# Form iskeleti dizine girmesin
[[headers]]
  for = "/__forms.html"
  [headers.values]
    X-Robots-Tag = "noindex"

# HTML her zaman dogrulansin
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
